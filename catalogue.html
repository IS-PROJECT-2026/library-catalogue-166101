<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogue | Mwangaza Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="site-title" href="index.html">Mwangaza Library</a>
      <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="siteNav">Menu</button>
      <nav class="site-nav" id="siteNav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="catalogue.html">Catalogue</a></li>
          <li><a href="about.html">About</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <h2 class="page-title">Catalogue</h2>
    <div class="controls">
      <label class="visually-hidden" for="searchInput">Search by title or author</label>
      <input type="search" id="searchInput" class="control-field"
             placeholder="Search by title or author"
             aria-label="Search the catalogue by title or author">

      <label class="visually-hidden" for="genreFilter">Filter by genre</label>
      <select id="genreFilter" class="control-field" aria-label="Filter the catalogue by genre">
        <option value="all">All genres</option>
      </select>
    </div>
    <p class="result-count" id="resultCount" aria-live="polite"></p>
    <div class="book-grid" id="bookGrid"></div>
  </main>

  <script src="js/books.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
